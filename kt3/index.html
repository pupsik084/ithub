<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Пуск</h1>
        <div class="user">
            <span>User</span>
            <div class="avatar">U</div>
        </div>
    </header>

    <main class="panel">
        <section class="group">
            <div class="column">
                <div class="tile wide blue">Почта</div>
                <div class="tile wide purple">Календарь</div>
                <div class="tile big yellow">Рабочий стол</div>
            </div>
            <div class="column">
                <div class="tile wide green">Финансы</div>
                <div class="row">
                    <div class="tile small blue">OneDrive</div>
                    <div class="tile small orange">Справка</div>
                </div>
                <div class="tile wide orange">Контакты</div>
                <div class="row">
                    <div class="tile small sky">Skype</div>
                    <div class="tile small magenta">Фото</div>
                </div>
            </div>
        </section>

        <section class="group">
            <div class="column">
                <div class="row">
                    <div class="tile small sky">Браузер</div>
                    <div class="tile small purple">Параметры</div>
                </div>
                <div class="tile big blue">Погода</div>
                <div class="tile wide purple">Спорт</div>
            </div>
            <div class="column">
                <div class="tile wide red">Новости</div>
                <div class="row">
                    <div class="tile small orange">Здоровье</div>
                    <div class="tile small teal">Галерея</div>
                </div>
                <div class="tile wide green">Магазин</div>
                <div class="tile wide teal">Путешествия</div>
            </div>
        </section>

        <section class="group">
            <div class="column">
                <div class="row">
                    <div class="tile small magenta">Карты</div>
                    <div class="tile small red">Книги</div>
                </div>
                <div class="tile wide orange">Музыка</div>
                <div class="row">
                    <div class="tile small green">Игры</div>
                    <div class="tile small magenta">Камера</div>
                </div>
                <div class="tile wide red">Видео</div>
            </div>
            <div class="column">
                <div class="tile big teal">Заметки</div>
                <div class="tile wide blue">Документы</div>
                <div class="row">
                    <div class="tile small purple">Часы</div>
                    <div class="tile small green">Калькулятор</div>
                </div>
            </div>
        </section>

        <section class="group">
            <div class="column">
                <div class="tile wide sky">Сообщения</div>
                <div class="row">
                    <div class="tile small orange">Файлы</div>
                    <div class="tile small blue">Поиск</div>
                </div>
                <div class="tile wide green">Загрузки</div>
                <div class="tile wide purple">Радио</div>
            </div>
        </section>
    </main>
</body>
</html>
